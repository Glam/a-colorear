name = "a-colorear"
main = "worker.mjs"
compatibility_date = "2026-07-28"

[vars]
ALLOWED_ORIGIN = "https://a-colorear.pages.dev"

[observability]
enabled = true

# Límites de peticiones (period solo admite 10 o 60 segundos).
# 5 dibujos por minuto por IP.
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Tope global: 30 dibujos por minuto entre todos los usuarios.
[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
